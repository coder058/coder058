<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Head of Portfolio</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --tx:#1d1d1b; --mut:#6b6b66; --bd:#e2e1db; --ac:#c2410c; --ok:#15803d; --yo:#1d1d1b; --yotx:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --card:#21211f; --tx:#ecebe7; --mut:#9a9a94; --bd:#34342f; --ac:#fb923c; --ok:#4ade80; --yo:#ecebe7; --yotx:#151514; } }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.5 system-ui,sans-serif }
  .app { display:grid; grid-template-columns:1fr 300px; height:100vh; max-width:1200px; margin:0 auto }
  @media (max-width:800px) { .app { grid-template-columns:1fr; height:auto } .lado { order:-1 } }
  .chat { display:flex; flex-direction:column; min-height:0; padding:16px }
  header h1 { font-size:18px; margin:0 } .mut { color:var(--mut); font-size:13px }
  #mensajes { flex:1; overflow-y:auto; padding:12px 0; display:flex; flex-direction:column; gap:10px; min-height:300px }
  .burbuja { max-width:80%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word }
  .claude { background:var(--card); border:1px solid var(--bd); align-self:flex-start; border-bottom-left-radius:4px }
  .humano { background:var(--yo); color:var(--yotx); align-self:flex-end; border-bottom-right-radius:4px }
  .quien { font-size:12px; color:var(--mut); margin-bottom:2px }
  .pensando { align-self:flex-start; color:var(--mut); font-style:italic }
  form { display:flex; gap:8px; padding-top:8px; border-top:1px solid var(--bd) }
  textarea { flex:1; font:inherit; color:inherit; background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:10px; resize:none; height:64px }
  button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--bd); border-radius:8px; padding:6px 12px; cursor:pointer }
  button:hover { border-color:var(--ac) }
  form button { background:var(--ac); color:#fff; border:0; padding:0 18px }
  .lado { border-left:1px solid var(--bd); padding:16px; overflow-y:auto }
  .lado h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); margin:0 0 8px }
  .trab { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:10px 12px; margin-bottom:8px }
  .trab strong { display:flex; justify-content:space-between; align-items:center }
  .punto { width:9px; height:9px; border-radius:50%; background:var(--bd); display:inline-block }
  .punto.activo { background:var(--ac); animation:lat 1s infinite alternate } .punto.ok { background:var(--ok) }
  @keyframes lat { to { opacity:.3 } }
  details { margin-top:6px } summary { cursor:pointer; font-size:13px; color:var(--mut) }
  details textarea { width:100%; height:80px; margin-top:6px }
  .log { font:12px/1.4 ui-monospace,monospace; color:var(--mut); white-space:pre-wrap; margin-top:16px }
  .actividad { font-size:13px; border-left:2px solid var(--bd); padding-left:8px; margin:6px 0 }
</style>
</head>
<body>
<div class="app">
  <main class="chat">
    <header>
      <h1>Claude · Head of Portfolio</h1>
      <div class="mut" id="sub">Háblame aquí. Yo reparto el trabajo a Cursor, Grok y Sol y te cuento lo que respondan.</div>
    </header>
    <div id="mensajes"></div>
    <form id="form">
      <textarea id="texto" placeholder="Escribe a Claude… (Enter envía, Shift+Enter salta línea)"></textarea>
      <button>Enviar</button>
    </form>
  </main>
  <aside class="lado">
    <h2>Trabajadores</h2>
    <div id="trabajadores"></div>
    <h2 style="margin-top:16px">Actividad</h2>
    <div id="actividad"></div>
    <div class="log" id="log"></div>
  </aside>
</div>
<script>
const $ = s => document.querySelector(s);
const api = (url, body) => fetch(url, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : undefined).then(r => r.json());
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ROL = {cursor:"código", grok:"investiga", sol:"ChatGPT · redacta"};
let vistos = -1;

async function cargar() {
  const d = await api("/api/mensajes");
  const ms = d.mensajes;

  // Chat: solo tú y Claude.
  const chat = ms.filter(m => (m.de === "humano" && m.para === "claude") || (m.de === "claude" && m.para === "humano"));
  const caja = $("#mensajes");
  if (chat.length !== vistos) {
    const abajo = caja.scrollHeight - caja.scrollTop - caja.clientHeight < 60;
    caja.innerHTML = chat.map(m => `<div class="burbuja ${m.de}"><div class="quien">${m.de === "humano" ? "Tú" : "Claude"}</div>${esc(m.cuerpo)}</div>`).join("")
      || `<div class="mut">Aún no hay conversación. Escribe tu primer mensaje.</div>`;
    if (abajo || vistos < 0) caja.scrollTop = caja.scrollHeight;
    vistos = chat.length;
  }
  $("#pensando")?.remove();
  const claudePiensa = d.trabajando.includes("claude") || ms.some(m => m.para === "claude" && m.estado === "pendiente");
  if (claudePiensa) caja.insertAdjacentHTML("beforeend", `<div class="pensando" id="pensando">Claude está pensando…</div>`);

  // Trabajadores
  $("#trabajadores").innerHTML = ["cursor", "grok", "sol"].map(a => {
    const pend = ms.filter(m => m.para === a && m.estado === "pendiente").length;
    const ultima = ms.filter(m => m.de === a).pop();
    const estado = d.trabajando.includes(a) ? "activo" : (ultima ? "ok" : "");
    const txt = d.trabajando.includes(a) ? "trabajando ahora" : pend ? `${pend} orden(es) en cola` : ultima ? "respondió" : "sin actividad";
    const manual = d.web.includes(a) && pend ? `<details><summary>¿El navegador falla? Hazlo a mano</summary>
        <button onclick="copiar('${a}')">Copiar prompt</button>
        <textarea id="resp-${a}" placeholder="Pega aquí lo que respondió ${a}"></textarea>
        <button onclick="importar('${a}')">Pegar respuesta</button></details>` : "";
    return `<div class="trab"><strong>${a} <span class="punto ${estado}"></span></strong><div class="mut">${ROL[a]} · ${txt}</div>${manual}</div>`;
  }).join("");

  // Actividad del equipo (órdenes y respuestas entre Claude y los trabajadores)
  const equipo = ms.filter(m => m.de !== "humano" && m.para !== "humano").slice(-8).reverse();
  $("#actividad").innerHTML = equipo.map(m => `<div class="actividad"><strong>${m.de} → ${m.para}</strong> <span class="mut">${m.estado}</span><br>${esc(m.cuerpo.slice(0, 120))}${m.cuerpo.length > 120 ? "…" : ""}</div>`).join("") || `<div class="mut">Nada todavía.</div>`;
  $("#log").textContent = d.orquestador ? d.log.slice(-6).join("\n") : "Orquestador apagado (--sin-orquestador): nadie se despierta solo.";
}

async function copiar(a) {
  const {prompt} = await api("/api/prompt/" + a);
  await navigator.clipboard.writeText(prompt);
  alert(`Prompt de ${a} copiado. Pégalo en su chat.`);
}
async function importar(a) {
  const texto = $("#resp-" + a).value.trim();
  if (texto) { await api("/api/importar", {agente: a, texto}); cargar(); }
}

$("#form").onsubmit = async e => {
  e.preventDefault();
  const texto = $("#texto").value.trim();
  if (!texto) return;
  $("#texto").value = "";
  await api("/api/chat", {texto});
  cargar();
};
$("#texto").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit(); } };

cargar();
setInterval(cargar, 3000);
</script>
</body>
</html>
