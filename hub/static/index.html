<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub de agentes</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --tx:#1d1d1b; --mut:#6b6b66; --bd:#e2e2dd; --ac:#c2410c; --ok:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#21211f; --tx:#ececea; --mut:#9a9a94; --bd:#33332f; --ac:#fb923c; --ok:#4ade80; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.5 system-ui,sans-serif }
  main { max-width:1100px; margin:0 auto; padding:16px }
  h1 { font-size:20px; margin:4px 0 2px } .mut { color:var(--mut); font-size:13px }
  .agentes { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:16px 0 }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:12px }
  .card h2 { margin:0 0 6px; font-size:16px; display:flex; justify-content:space-between }
  .badge { background:var(--ac); color:#fff; border-radius:99px; padding:0 8px; font-size:12px }
  .badge.cero { background:var(--bd); color:var(--mut) }
  button, select, textarea { font:inherit; color:inherit }
  button { background:var(--card); border:1px solid var(--bd); border-radius:6px; padding:4px 10px; cursor:pointer; margin:4px 4px 0 0 }
  button:hover { border-color:var(--ac) }
  textarea { width:100%; min-height:80px; background:var(--bg); border:1px solid var(--bd); border-radius:6px; padding:8px }
  select { background:var(--bg); border:1px solid var(--bd); border-radius:6px; padding:4px }
  .msg { border-left:3px solid var(--ac); padding:8px 12px; margin:8px 0; background:var(--card); border-radius:0 8px 8px 0 }
  .msg.respondido { border-left-color:var(--ok); opacity:.7 }
  .msg pre { white-space:pre-wrap; margin:6px 0 0; font:inherit }
  .fila { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px }
</style>
</head>
<body>
<main>
  <h1>Hub de agentes</h1>
  <div class="mut">Claude · Cursor · Grok · Sol — mensajes en <code>hub/mensajes/</code>. Se refresca solo; revisión con aviso cada 5 min. <span id="hora"></span></div>

  <section class="agentes" id="agentes"></section>

  <section class="card">
    <div class="fila">
      <strong>Nuevo mensaje</strong>
      de <select id="de"></select> para <select id="para"></select>
    </div>
    <textarea id="cuerpo" placeholder="Orden o mensaje..."></textarea>
    <button id="enviar">Enviar</button>
  </section>

  <h2 style="font-size:16px;margin-top:20px">Conversación</h2>
  <div id="lista"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const api = (url, body) => fetch(url, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : undefined).then(r => r.json());
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WEB = ["grok", "sol"]; // chats sin acceso a archivos: puente copiar/pegar
let previos = -1;

async function cargar() {
  const {agentes, mensajes} = await api("/api/mensajes");
  if (!$("#de").options.length) {
    $("#de").innerHTML = ["humano", ...agentes].map(a => `<option>${a}</option>`).join("");
    $("#para").innerHTML = [...agentes, "todos"].map(a => `<option>${a}</option>`).join("");
  }
  const pend = a => mensajes.filter(m => m.estado === "pendiente" && (m.para === a || m.para === "todos") && m.de !== a).length;
  $("#agentes").innerHTML = agentes.map(a => {
    const n = pend(a);
    const extra = WEB.includes(a)
      ? `<button onclick="copiar('${a}')">Copiar prompt</button>
         <textarea id="resp-${a}" placeholder="Pega aquí la respuesta de ${a}..."></textarea>
         <button onclick="importar('${a}')">Pegar respuesta</button>`
      : `<div class="mut">${a === "claude" ? "Se despierta solo con /loop 5m" : "Lee el repo; dile que procese su buzón"}</div>`;
    return `<div class="card"><h2>${a}<span class="badge ${n ? "" : "cero"}">${n}</span></h2>${extra}</div>`;
  }).join("");
  $("#lista").innerHTML = mensajes.slice().reverse().map(m => `
    <div class="msg ${m.estado}">
      <strong>${esc(m.de)} → ${esc(m.para)}</strong>
      <span class="mut">· ${esc(m.archivo)} · ${m.estado}${m.responde_a ? " · responde a " + esc(m.responde_a) : ""}</span>
      ${m.estado === "pendiente" ? `<button onclick="hecho('${esc(m.archivo)}')">Marcar respondido</button>` : ""}
      <pre>${esc(m.cuerpo)}</pre>
    </div>`).join("") || `<div class="mut">Aún no hay mensajes.</div>`;
  const total = mensajes.filter(m => m.estado === "pendiente").length;
  if (previos >= 0 && total > previos && Notification.permission === "granted") new Notification(`Hub: ${total} pendiente(s)`);
  previos = total;
  $("#hora").textContent = "Última revisión " + new Date().toLocaleTimeString();
}

async function copiar(a) {
  const {prompt} = await api("/api/prompt/" + a);
  await navigator.clipboard.writeText(prompt);
  alert(`Prompt de ${a} copiado. Pégalo en su chat.`);
}
async function importar(a) {
  const texto = $("#resp-" + a).value.trim();
  if (!texto) return;
  await api("/api/importar", {agente: a, texto});
  cargar();
}
async function hecho(archivo) { await api("/api/respondido", {archivo}); cargar(); }

$("#enviar").onclick = async () => {
  const cuerpo = $("#cuerpo").value.trim();
  if (!cuerpo) return;
  await api("/api/enviar", {de: $("#de").value, para: $("#para").value, cuerpo});
  $("#cuerpo").value = ""; cargar();
};

if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
cargar();
setInterval(cargar, 15000);       // refresco visual
setInterval(() => {               // el "loop" de 5 min: avisa si hay pendientes
  cargar().then(() => { if (previos > 0) document.title = `(${previos}) Hub de agentes`; });
}, 5 * 60 * 1000);
</script>
</body>
</html>
